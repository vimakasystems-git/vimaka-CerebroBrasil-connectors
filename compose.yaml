name: cerebrobrasil-integration-dev
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cerebro
      POSTGRES_DB: cerebro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerebro -d cerebro"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
  redis:
    image: redis:7.4-alpine
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run npm run setup}
    command:
      - sh
      - -c
      - 'umask 077; printf "requirepass %s\nappendonly yes\ndir /data\n" "$$REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf'
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
volumes:
  postgres-data:
  redis-data:
